name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --console=plain

  database:
    name: Database migrations + security tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  edge-functions:
    name: Edge Functions type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
